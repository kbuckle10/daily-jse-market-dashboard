name: Test Price Performance links
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'decision-matrix.js'
      - 'dividend-display.js'
      - 'tests/performance-table-layout.cjs'
      - 'tests/price-performance-links.cjs'
      - '.github/workflows/test-price-performance-links.yml'
  workflow_dispatch:
jobs:
  mobile-chrome-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/performance-table-layout.cjs
      - run: node tests/price-performance-links.cjs
