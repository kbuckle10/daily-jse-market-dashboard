name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Daily JSE Main Market"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./_site' \
            --exclude='./.DS_Store' \
            . | tar -xf - -C _site
          test -s _site/index.html
          test -s _site/data.js
          echo "Staged dashboard and market data:"
          ls -lh _site/index.html _site/data.js
      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages
      - name: Verify deployment artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || { echo '::error::Pages artifact upload returned no artifact ID'; exit 1; }
          echo "Uploaded Pages artifact ID: $ARTIFACT_ID"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
