name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Daily JSE Main Market"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./_site' \
            --exclude='./.DS_Store' \
            . | tar -xf - -C _site
          test -s _site/index.html
          test -s _site/data.js
          echo "Staged dashboard and market data:"
          ls -lh _site/index.html _site/data.js
      - name: Install browser test dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify actual dashboard rating and filters before publishing
        run: |
          python3 -m http.server 8765 --directory _site >/tmp/pages-server.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const ctx={window:{}};
          vm.runInNewContext(fs.readFileSync('_site/data.js','utf8'),ctx);
          const stocks=ctx.window.JSE_DASHBOARD_DATA.stocks;
          const browser=await chromium.launch({headless:true});
          try {
            for(const viewport of [{width:390,height:844},{width:1440,height:900}]){
              const page=await browser.newPage({viewport,serviceWorkers:'block'});
              await page.addInitScript(tickers=>localStorage.setItem('dailyJseTrackedTickersV2',JSON.stringify(tickers)),stocks.map(s=>s.ticker));
              await page.goto('http://localhost:8765/',{waitUntil:'load'});
              for(const filter of ['all','buy','zone','income','movement','dividend']){
                await page.locator('.filter-tile[data-filter="'+filter+'"]').evaluate(el=>el.click());
                await page.waitForTimeout(900);
                const cards=await page.locator('#cardView .stock-card').evaluateAll(els=>els.map(e=>({ticker:e.dataset.stockTicker || e.querySelector('h3,.ticker')?.textContent.trim() || '',rating:e.querySelector('.rating')?.textContent.trim() || '[missing rating]',cls:e.querySelector('.rating')?.className || ''})));
                const rows=await page.locator('#stockTableBody tr:has(.ticker)').evaluateAll(els=>els.map(e=>({ticker:e.dataset.stockTicker || e.querySelector('.ticker')?.textContent.trim() || '',rating:e.querySelector('.rating')?.textContent.trim() || '[missing rating]',cls:e.querySelector('.rating')?.className || ''})));
                const expected=await page.evaluate(f=>trackedStocks().filter(s=>matchesTile(s,f)).map(s=>s.ticker),filter);
                for(const [view,items] of [['cards',cards],['rows',rows]]){
                  assert.deepEqual(items.map(x=>x.ticker).sort(),expected.sort(),filter+' membership');
                  for(const item of items){
                    const s=stocks.find(x=>x.ticker===item.ticker);
                    assert.ok(s, 'Unknown rendered ticker: '+JSON.stringify(item));
                    assert.ok(item.cls.split(/\s+/).includes(s.ratingClass),`${viewport.width}px ${filter} ${view}: ${item.ticker} rating class: ${JSON.stringify(item)}`);
                    assert.equal(/^(strong buy|buy)/i.test(item.rating),s.ratingClass==='buy',item.ticker+' badge '+item.rating);
                  }
                }
                if(filter==='all')assert.equal(cards.length,stocks.length);
                if(filter==='buy'){
                  const canonical=stocks.filter(s=>s.ratingClass==='buy').map(s=>s.ticker).sort();
                  assert.deepEqual(cards.map(x=>x.ticker).sort(),canonical,`${viewport.width}px BUY cards must match data.js exactly`);
                  assert.deepEqual(rows.map(x=>x.ticker).sort(),canonical,`${viewport.width}px BUY rows must match data.js exactly`);
                  assert.equal(Number(await page.locator('#buyCount').textContent()),canonical.length,'BUY tile count');
                }
              }
              await page.close();
            }
          }finally{await browser.close();}
          JS
      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages
      - name: Verify deployment artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || { echo '::error::Pages artifact upload returned no artifact ID'; exit 1; }
          echo "Uploaded Pages artifact ID: $ARTIFACT_ID"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
