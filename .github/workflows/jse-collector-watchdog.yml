name: JSE Collector Watchdog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check status only (do not dispatch a recovery run)'
        type: boolean
        required: true
        default: true
  schedule:
    # Jamaica UTC-5 year-round. Stagger checks after the primary and fallback collector slots.
    # Off-peak minute offsets reduce contention with top-of-hour GitHub schedules.
    - cron: '11 22 * * 1-5'  # 5:11 PM
    - cron: '47 22 * * 1-5'  # 5:47 PM
    - cron: '23 23 * * 1-5'  # 6:23 PM
    - cron: '11 0 * * 2-6'   # 7:11 PM on previous Jamaica day

permissions:
  actions: write
  contents: read

concurrency:
  group: jse-collector-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect collector and conditionally dispatch recovery
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflow_id = 'refresh-sa-performance.yml';
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Jamaica', year: 'numeric', month: '2-digit',
              day: '2-digit', weekday: 'short', hour: '2-digit', hourCycle: 'h23'
            }).formatToParts(now);
            const part = (type) => parts.find(p => p.type === type)?.value;
            const jamaicaDate = `${part('year')}-${part('month')}-${part('day')}`;
            const weekday = part('weekday');
            const midnightUTC = Date.parse(`${jamaicaDate}T05:00:00Z`);
            const dryRun = process.env.DRY_RUN === 'true';
            const report = (message) => {
              core.info(message);
              core.summary.addRaw(message + '\n');
            };
            report(`Jamaica date: ${jamaicaDate}; dry run: ${dryRun}`);
            if (['Sat', 'Sun'].includes(weekday)) {
              report('Weekend in Jamaica: no action.');
              await core.summary.write();
              return;
            }

            // Fail closed on API errors. Never dispatch without a reliable run listing.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              per_page: 100,
              created: `>=${jamaicaDate}`
            });
            const todaysRuns = runs.filter(r => Date.parse(r.created_at) >= midnightUTC);
            const details = todaysRuns.map(r =>
              `#${r.run_number} (${r.event}, ${r.status}, ${r.conclusion ?? 'pending'}): ${r.html_url}`
            );
            report(details.length ? details.join('\n') : 'No collector run found for today.');

            // Inspect the published data date, not merely whether a workflow started.
            const file=await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path:'data.js', ref:'main'
            });
            const raw=Buffer.from(file.data.content,'base64').toString('utf8');
            const match=raw.match(/"updated"\\s*:\\s*"([^"]+)"/);
            const publishedDate=match?.[1]||'unknown';
            report(`Published dataset date: ${publishedDate}`);
            const active=todaysRuns.filter(r=>r.status!=='completed');
            const recent=todaysRuns.some(r=>Date.now()-Date.parse(r.created_at)<45*60000);
            if(publishedDate===jamaicaDate){
              report('SKIP: Today\'s market dataset is published.');
            } else if(active.length){
              report('SKIP: Collector currently active; awaiting completion.');
            } else if(recent){
              report('SKIP: Recent collector attempt; waiting 45 minutes before recovery.');
            } else if(todaysRuns.length>=4){
              report('::warning::Four collector attempts today without a fresh dataset; manual review required.');
            } else if (dryRun) {
              report('DRY RUN: Collector is absent; dispatch would be requested in live mode.');
            } else {
              // Recheck immediately before dispatch to reduce duplicate risk.
              const latest = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id, per_page: 100, created: `>=${jamaicaDate}`
              });
              if (latest.some(r => Date.parse(r.created_at) >= midnightUTC && (r.status !== 'completed' || Date.now()-Date.parse(r.created_at)<45*60000))) {
                report('SKIP: A collector run appeared on the second check.');
              } else {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  ref: 'main'
                });
                report('RECOVERY REQUESTED: workflow_dispatch accepted by GitHub (HTTP 204). Check collector workflow for actual run/completion.');
              }
            }
            await core.summary.write();
