name: Cash Flow Quality Research (Staging History Persistence)
on:
  workflow_dispatch:
  push:
    branches: [feature/cashflow-quality-staging-20261008]
    paths:
      - 'scripts/lib/cashflow-*.mjs'
      - 'scripts/test-cashflow-*.mjs'
      - 'scripts/probe-cashflow-history.mjs'
      - 'scripts/build-cashflow-quality-report.mjs'
      - 'scripts/refresh-sa-cashflow.mjs'
      - '.github/workflows/cashflow-quality-research.yml'
permissions:
  contents: write
concurrency:
  group: cashflow-history-staging
  cancel-in-progress: false
jobs:
  test-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cashflow-quality-staging-20261008
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright dependencies
        run: |
          npm install --no-save --package-lock=false
          npx playwright install --with-deps chromium
      - name: Verify syntax and deterministic tests
        run: |
          node --check scripts/lib/cashflow-quality-research.mjs
          node --check scripts/lib/cashflow-history.mjs
          node --check scripts/lib/cashflow-history-retention.mjs
          node --check scripts/lib/cashflow-history-store.mjs
          node --check scripts/update-cashflow-history-store.mjs
          node --check scripts/probe-cashflow-history.mjs
          node --check scripts/build-cashflow-quality-report.mjs
          node --check scripts/refresh-sa-cashflow.mjs
          node scripts/test-cashflow-quality-research.mjs
          node scripts/test-cashflow-history.mjs
          node scripts/test-cashflow-history-retention.mjs
          node scripts/test-cashflow-persisted-retention.mjs
          node scripts/test-cashflow-history-store.mjs
          node scripts/test-cashflow-committed-history.mjs
      - name: Collect five-stock historical statements (read only)
        run: node scripts/probe-cashflow-history.mjs
      - name: Validate and report historical cash flow
        if: always()
        run: |
          if [ -f artifacts/cashflow-feasibility.json ]; then
            node scripts/build-cashflow-quality-report.mjs
          fi
      - name: Persist standalone history in staging workspace (no commit)
        run: |
          cp data.js /tmp/history-store-data-before.js
          node scripts/update-cashflow-history-store.mjs
          cmp data.js /tmp/history-store-data-before.js
          test -s research/cashflow-history.json
      - name: Pilot collector integration dry run (never writes data.js)
        env:
          CASHFLOW_HISTORY_PILOT_ONLY: '1'
          CASHFLOW_HISTORY_DRY_RUN: '1'
          SA_CASHFLOW_CONCURRENCY: '2'
        run: |
          cp data.js /tmp/cashflow-data-before.js
          node scripts/refresh-sa-cashflow.mjs
          cmp data.js /tmp/cashflow-data-before.js
          test -f artifacts/cashflow-collector-preview.json
      - name: Commit validated history to staging branch only
        if: success()
        env:
          TARGET_BRANCH: feature/cashflow-quality-staging-20261008
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('artifacts/cashflow-quality-report.json','utf8'));
          if(report.complete!==true || report.results?.length!==5 || report.results.some(x=>!x.valid))throw Error('Five-stock validation gate failed');
          const store=JSON.parse(fs.readFileSync('research/cashflow-history.json','utf8'));
          const tickers=['SEP','TJH','NCBFG','GK','GHL'];
          for(const ticker of tickers){
            const h=store.stocks?.[ticker]?.history;
            if(!h||h.annual?.length<5||!h.ttm)throw Error('Missing persisted history: '+ticker);
          }
          NODE
          cmp data.js /tmp/history-store-data-before.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/cashflow-history.json
          if git diff --cached --quiet; then
            echo 'History unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'data: persist validated five-stock cash-flow history [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-quality-staging
          path: |
            artifacts/cashflow-*.json
            research/cashflow-history.json
          if-no-files-found: warn
          retention-days: 14
