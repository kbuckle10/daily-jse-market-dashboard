name: Sync Weekly Cash Flows to Daily Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
    - cron: '0 15 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-weekly-cashflows.yml'
      - 'scripts/sync-weekly-cashflows.mjs'
permissions:
  contents: write
concurrency:
  group: sync-weekly-cashflows
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize validated histories
        run: node scripts/sync-weekly-cashflows.mjs
      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cashflow-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync validated weekly cash flows into daily dashboard"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new cash-flow changes"
          fi
