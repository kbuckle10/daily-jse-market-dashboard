name: Weekly JSE Cash Flow History
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-cashflow-history.yml'
      - 'scripts/collect-cashflow-history.mjs'
      - 'scripts/collect-official-cashflow.mjs'
      - 'research/official-cashflow-sources.json'
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'
permissions:
  contents: write
concurrency:
  group: weekly-cashflow-history
  cancel-in-progress: false
jobs:
  refresh-history:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install PDF text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Collect official annual-report cash flows
        run: node scripts/collect-official-cashflow.mjs
      - name: Collect five-year history for Main Market universe
        run: node scripts/collect-cashflow-history.mjs
        env:
          CASHFLOW_CONCURRENCY: '2'
      - name: Commit updated research data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cashflow-history.json research/cashflow-coverage-report.json research/official-cashflow-extraction-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly JSE cash flow history"
            git push
          else
            echo "No changes to cash flow history"
          fi
