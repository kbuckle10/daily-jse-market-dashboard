name: Business Phase Pilot Validation (Staging Only)
on:
  workflow_dispatch:
  push:
    branches: [feature/cashflow-quality-staging-20261008]
    paths:
      - 'research/business-phase-four-stock-pilot.json'
      - 'scripts/validate-business-phase-pilot.mjs'
      - 'business-phase-four-stock-pilot.html'
      - 'index.html'
      - 'scripts/smoke-test-business-phase-pilot.mjs'
      - 'scripts/check-business-phase-release-readiness.mjs'
      - '.github/workflows/business-phase-pilot-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check validator syntax
        run: node --check scripts/validate-business-phase-pilot.mjs
      - name: Reconcile pilot arithmetic and generate metrics
        run: node scripts/validate-business-phase-pilot.mjs
      - name: Smoke test pilot page and research dataset
        run: node scripts/smoke-test-business-phase-pilot.mjs
      - name: Assess evidence-based release readiness
        run: node scripts/check-business-phase-release-readiness.mjs
      - name: Assert no unsupported phase assignment
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const data=JSON.parse(fs.readFileSync('research/business-phase-four-stock-pilot.json','utf8'));
          for(const [ticker,stock] of Object.entries(data.stocks)){
            assert.equal(stock.phase,'unclassified',ticker+' phase must remain unclassified');
            assert.equal(stock.sourceVerification,'pending',ticker+' external verification cannot be silently claimed complete');
          }
          console.log('PASS: no premature phase classification or source-verification claims');
          NODE
      - name: Capture staging research preview (desktop and mobile)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/business-phase-preview-http.log 2>&1 &
          npx --yes playwright@1.56.1 install chromium
          mkdir -p artifacts/preview
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1365,900" --full-page --wait-for-timeout 2000 http://127.0.0.1:8765/business-phase-four-stock-pilot.html artifacts/preview/desktop.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "390,844" --full-page --wait-for-timeout 2000 http://127.0.0.1:8765/business-phase-four-stock-pilot.html artifacts/preview/mobile.png
      - name: Upload staging browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: business-phase-pilot-browser-preview
          path: artifacts/preview/*.png
          retention-days: 14
      - name: Upload staging-only validation report
        uses: actions/upload-artifact@v4
        with:
          name: business-phase-pilot-validation
          path: |
            artifacts/business-phase-four-stock-validation.json
            artifacts/business-phase-release-readiness.json
          retention-days: 14
