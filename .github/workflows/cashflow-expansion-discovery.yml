name: Cash Flow Expansion Discovery (Research Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false
          npx playwright install --with-deps chromium
      - name: Probe nine additional core stocks without production writes
        env:
          CASHFLOW_EXPANSION_PROBE: '1'
        run: node scripts/probe-cashflow-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cashflow-expansion-feasibility
          path: artifacts/cashflow-expansion-feasibility.json
          retention-days: 14
