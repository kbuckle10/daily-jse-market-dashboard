name: Cash-flow feasibility probe (isolated)
on:
  push:
    branches:
      - feature/cashflow-history-feasibility
    paths:
      - '.github/workflows/cashflow-feasibility.yml'
      - 'scripts/probe-cashflow-history.mjs'
      - 'scripts/lib/cashflow-history.mjs'
      - 'scripts/test-cashflow-history.mjs'
      - 'scripts/refresh-sa-cashflow.mjs'
      - 'app.js'
      - 'scripts/build-cashflow-preview.mjs'
      - 'scripts/test-cashflow-preview-integration.mjs'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/feature/cashflow-history-feasibility'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated probe dependencies (no lockfile required)
        run: npm install --no-save --package-lock=false
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/build-cashflow-preview.mjs
          node --check scripts/test-cashflow-preview-integration.mjs
          node --check scripts/refresh-sa-cashflow.mjs
          node --check scripts/probe-cashflow-history.mjs
          node --check scripts/lib/cashflow-history.mjs
      - name: Unit-test historical cash flow parsing
        run: node scripts/test-cashflow-history.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run read-only financial history probe
        run: node scripts/probe-cashflow-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cashflow-feasibility-report
          path: artifacts/cashflow-feasibility.json
          if-no-files-found: warn

      - name: Build isolated five-stock dashboard preview
        run: node scripts/build-cashflow-preview.mjs
      - name: Check existing dashboard data is unchanged
        run: node scripts/test-cashflow-preview-integration.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cashflow-dashboard-preview
          path: artifacts/dashboard-preview/
          if-no-files-found: error
