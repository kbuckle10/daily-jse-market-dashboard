name: Refresh Daily JSE Main Market

on:
  workflow_dispatch:
  schedule:
    # Primary: 21:30 UTC = 16:30 Jamaica (UTC-5 year-round)
    - cron: '30 21 * * *'
    # Safety fallback: 22:00 UTC = 17:00 Jamaica. It skips only if a post-close refresh already published.
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: daily-jse-main-market-refresh
  # Do not let the 5 PM fallback cancel a delayed/running 4:30 PM primary refresh.
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether this run is needed
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -e
          echo "event=$EVENT_NAME schedule=${EVENT_SCHEDULE:-none}"

          # Manual runs and the 4:30 PM primary always proceed.
          if [ "$EVENT_NAME" != "schedule" ] || [ "$EVENT_SCHEDULE" != "0 22 * * *" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding: this is not the 5 PM safety fallback."
            exit 0
          fi

          # The 5 PM safety run skips only when a successful refresh from the
          # post-close window (4:30 PM Jamaica or later) has already published today.
          # A pre-market or overnight refresh on the same date must never suppress it.
          node <<'NODE' > /tmp/fallback_guard.txt
          const fs = require('fs');
          const vm = require('vm');
          const raw = fs.readFileSync('data.js','utf8');
          const m = raw.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/);
          if (!m) {
            console.log('RUN|Unable to parse data.js, so fallback will run');
            process.exit(0);
          }
          const data = vm.runInNewContext(`(${m[1]})`);
          if (!data.refreshedAt) {
            console.log('RUN|No refreshedAt timestamp, so fallback will run');
            process.exit(0);
          }
          const refreshed = new Date(data.refreshedAt);
          if (Number.isNaN(refreshed.valueOf())) {
            console.log('RUN|Invalid refreshedAt timestamp, so fallback will run');
            process.exit(0);
          }
          const jamaicaDate = d => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Jamaica', year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(d);
          const jamaicaClock = d => {
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Jamaica', hour12: false, hour: '2-digit', minute: '2-digit'
            }).formatToParts(d);
            const get = type => Number(parts.find(p => p.type === type)?.value || 0);
            return { hour: get('hour'), minute: get('minute') };
          };
          const now = new Date();
          const sameJamaicaDay = jamaicaDate(refreshed) === jamaicaDate(now);
          const ageMinutes = (now - refreshed) / 60000;
          const clock = jamaicaClock(refreshed);
          const postCloseRefresh = clock.hour > 16 || (clock.hour === 16 && clock.minute >= 30);
          if (sameJamaicaDay && postCloseRefresh && ageMinutes >= 0 && ageMinutes <= 180) {
            console.log(`SKIP|Post-close refresh already published at ${data.refreshedAt} (${ageMinutes.toFixed(1)} minutes ago)`);
          } else {
            console.log(`RUN|No recent post-close Jamaica refresh found; refreshedAt=${data.refreshedAt}`);
          }
          NODE

          cat /tmp/fallback_guard.txt
          DECISION=$(cut -d'|' -f1 /tmp/fallback_guard.txt | tail -1)
          if [ "$DECISION" = "SKIP" ]; then
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "5 PM fallback skipped because today's post-close primary refresh already completed."
          else
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "5 PM fallback will run because today's post-close primary refresh is missing or stale."
          fi

      - name: Setup Node
        if: steps.guard.outputs.run_refresh == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.guard.outputs.run_refresh == 'true'
        run: npm install

      - name: Install Chromium
        if: steps.guard.outputs.run_refresh == 'true'
        run: npx playwright install --with-deps chromium

      - name: Refresh full dataset from a stable main HEAD
        if: steps.guard.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -e
          MAX_ATTEMPTS=2
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Refresh attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            git fetch origin main
            git reset --hard origin/main
            START_HEAD=$(git rev-parse HEAD)

            npm run sync:main-market
            npm run refresh:sa || true
            npm run refresh:sa-research || true
            node scripts/refresh-sa-latest-dividend.mjs || true
            npm run refresh:crosslisted || true
            npm run refresh:jse || true
            npm run refresh:jse-links || true
            npm run refresh:jse-actions || true
            npm run refresh:book-value || true

            node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const raw = fs.readFileSync('data.js','utf8');
          const m = raw.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/);
          if (!m) throw new Error('Unable to parse data.js');
          const data = vm.runInNewContext(`(${m[1]})`);
          if (!Array.isArray(data.stocks) || data.stocks.length < 20) throw new Error(`Main Market universe unexpectedly small: ${data.stocks?.length || 0}`);
          const bad = data.stocks.filter(s => !s.ticker || !s.company);
          if (bad.length) throw new Error(`Invalid stock records: ${bad.length}`);

          const priced = data.stocks.filter(s => s.price != null && Number.isFinite(Number(s.price))).length;
          const researched = data.stocks.filter(s => s.pe != null || s.roe != null || s.ttmDps != null).length;
          const valued = data.stocks.filter(s => s.buyLow != null && s.buyHigh != null && s.rating).length;
          const book = data.stocks.filter(s => s.pb != null && s.bookValuePerShare != null && s.bookValueStatus).length;
          if (book < 10) throw new Error(`Book-value enrichment unexpectedly sparse: ${book}`);

          const coreTickers = ['TJH','CAR','NCBFG','SVL','GK','JMMBGL','KW','SEP','LASD','LASM','BIL','SJ'];
          const requiredPerformance = ['dayJmd','dayPct','w1','m1','ytd','m3','m6','y1'];
          const coreErrors = [];
          for (const ticker of coreTickers) {
            const stock = data.stocks.find(s => s.ticker === ticker);
            if (!stock) { coreErrors.push(`${ticker}: missing stock record`); continue; }
            if (stock.price == null || !Number.isFinite(Number(stock.price))) coreErrors.push(`${ticker}: price`);
            if (!['JSE','SA'].includes(stock.source)) coreErrors.push(`${ticker}: source`);
            for (const field of requiredPerformance) {
              if (stock[field] == null || !Number.isFinite(Number(stock[field]))) coreErrors.push(`${ticker}: ${field}`);
            }
          }
          if (coreErrors.length) throw new Error(`Core 12-stock validation failed: ${coreErrors.join(', ')}`);

          const ghl = data.stocks.find(s => s.ticker === 'GHL');
          if (ghl && ghl.jseCorporateActionStatus === 'ok' && ghl.latestDividendCurrency !== 'TTD') throw new Error(`GHL JSE corporate-action currency mismatch: ${ghl.latestDividendCurrency}`);
          console.log(`Validated ${data.stocks.length} Main Market stocks; ${priced} priced, ${researched} with SA research fields, ${valued} with rating/buy-zone data, ${book} with book-value valuation. Core 12 all have price, DAY, 1W, 1M, YTD, 3M, 6M and 1Y.`);
          NODE

            # Stamp the completion time only after every collector and validation has finished.
            # The UI converts this UTC ISO timestamp to America/Jamaica for display.
            node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const raw = fs.readFileSync('data.js','utf8');
          const m = raw.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/);
          if (!m) throw new Error('Unable to parse data.js for refresh timestamp');
          const data = vm.runInNewContext(`(${m[1]})`);
          data.refreshedAt = new Date().toISOString();
          fs.writeFileSync('data.js', `window.JSE_DASHBOARD_DATA = ${JSON.stringify(data, null, 2)};\n`);
          console.log(`Stamped successful refresh completion: ${data.refreshedAt}`);
          NODE

            if git diff --quiet -- data.js; then
              echo 'No data changes.'
              exit 0
            fi

            git fetch origin main
            REMOTE_HEAD=$(git rev-parse origin/main)
            if [ "$START_HEAD" = "$REMOTE_HEAD" ]; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add data.js
              git commit -m 'refresh full JSE Main Market daily data and SA research'
              git push origin HEAD:main
              exit 0
            fi

            # UI-only commits during the ~30 minute collector must not discard a valid refresh.
            # If collector/data inputs did not change, transplant the generated data.js onto
            # latest main and publish it while preserving all intervening UI commits.
            if git diff --quiet "$START_HEAD" "$REMOTE_HEAD" -- data.js package.json package-lock.json scripts .github/workflows/refresh-sa-performance.yml; then
              echo "main changed only in non-collector/UI files; publishing refreshed data on top of latest main"
              cp data.js /tmp/refreshed-data.js
              git reset --hard origin/main
              cp /tmp/refreshed-data.js data.js
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add data.js
              git commit -m 'refresh full JSE Main Market daily data and SA research'
              git push origin HEAD:main
              exit 0
            fi

            echo "collector/data inputs changed during attempt $ATTEMPT; discarding generated data and retrying from latest main"
            ATTEMPT=$((ATTEMPT+1))
          done

          echo "collector/data inputs changed during both refresh attempts; failing instead of reporting false success without publishing"
          exit 1

# Manual trigger marker: production refresh 2026-08-27 Jamaica
