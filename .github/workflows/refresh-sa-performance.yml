name: Refresh Daily JSE Main Market

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # 4:30 PM Jamaica
    - cron: '0 22 * * *'  # 5:00 PM Jamaica fallback

permissions:
  contents: write

concurrency:
  group: daily-jse-main-market-refresh
  cancel-in-progress: false

env:
  SHARD_COUNT: 5

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.guard.outputs.run_refresh }}
      start_head: ${{ steps.head.outputs.start_head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$EVENT_SCHEDULE" != "0 22 * * *" ]; then echo "run_refresh=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node <<'NODE' >/tmp/guard
          const fs=require('fs'),vm=require('vm');const raw=fs.readFileSync('data.js','utf8'),m=raw.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/);if(!m){console.log('RUN');process.exit()};const d=vm.runInNewContext(`(${m[1]})`),r=new Date(d.refreshedAt),n=new Date();if(Number.isNaN(r.valueOf())){console.log('RUN');process.exit()};const fmt=x=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Jamaica',year:'numeric',month:'2-digit',day:'2-digit'}).format(x);const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Jamaica',hour12:false,hour:'2-digit',minute:'2-digit'}).formatToParts(r),g=t=>Number(p.find(x=>x.type===t)?.value||0),post=g('hour')>16||(g('hour')===16&&g('minute')>=30),age=(n-r)/60000;console.log(fmt(r)===fmt(n)&&post&&age>=0&&age<=180?'SKIP':'RUN');
          NODE
          [ "$(tail -1 /tmp/guard)" = SKIP ] && echo "run_refresh=false" >> "$GITHUB_OUTPUT" || echo "run_refresh=true" >> "$GITHUB_OUTPUT"
      - id: head
        if: steps.guard.outputs.run_refresh == 'true'
        run: echo "start_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.run_refresh == 'true'
        with:
          node-version: '22'
      - if: steps.guard.outputs.run_refresh == 'true'
        run: npm run sync:main-market
      - name: Validate dynamic universe
        if: steps.guard.outputs.run_refresh == 'true'
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),r=fs.readFileSync('data.js','utf8'),m=r.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/),d=vm.runInNewContext(`(${m[1]})`);if(!Array.isArray(d.stocks)||d.stocks.length<20)throw Error(`Universe unexpectedly small: ${d.stocks?.length||0}`);console.log(`Dynamic Main Market universe: ${d.stocks.length} tickers`);
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.run_refresh == 'true'
        with:
          name: baseline
          path: data.js
          retention-days: 1

  collect:
    needs: prepare
    if: needs.prepare.outputs.run_refresh == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: baseline
          path: baseline
      - name: Prepare dynamic shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          cp baseline/data.js data.js
          node scripts/prepare-shard.mjs
      - name: Collect shard
        run: |
          npm run refresh:sa || true
          npm run refresh:sa-research || true
          node scripts/refresh-sa-latest-dividend.mjs || true
          npm run refresh:crosslisted || true
          npm run refresh:jse || true
          npm run refresh:jse-links || true
          npm run refresh:jse-actions || true
          npm run refresh:book-value || true
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data.js
          retention-days: 1

  merge-publish:
    needs: [prepare, collect]
    if: needs.prepare.outputs.run_refresh == 'true' && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: baseline
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge five non-overlapping ticker shards
        run: |
          cp baseline/data.js data.js
          node scripts/merge-shards.mjs
      - name: Validate merged dataset
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),raw=fs.readFileSync('data.js','utf8'),m=raw.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/),d=vm.runInNewContext(`(${m[1]})`);if(!Array.isArray(d.stocks)||d.stocks.length<20)throw Error('Invalid merged universe');const dup=d.stocks.map(s=>s.ticker).filter((t,i,a)=>a.indexOf(t)!==i);if(dup.length)throw Error(`Duplicate tickers: ${dup.join(',')}`);const core=['TJH','CAR','NCBFG','SVL','GK','JMMBGL','KW','SEP','LASD','LASM','BIL','SJ'];for(const t of core){const s=d.stocks.find(x=>x.ticker===t);if(!s||!Number.isFinite(Number(s.price)))throw Error(`${t}: missing price`)}const g=d.stocks.find(x=>x.ticker==='GHL');if(g&&g.primaryListing?.market!=='TTSE')throw Error(`GHL primary listing not TTSE: ${g.primaryListing?.market}`);if(g&&g.latestDividendCurrency!=='TTD')throw Error(`GHL dividend currency not TTD: ${g.latestDividendCurrency}`);console.log(`Validated ${d.stocks.length} dynamic tickers; no duplicates; GHL TTSE/TTD rule preserved.`);
          NODE
      - name: Publish once
        env:
          START_HEAD: ${{ needs.prepare.outputs.start_head }}
        run: |
          set -e
          cp data.js /tmp/refreshed-data.js
          git fetch origin main
          REMOTE_HEAD=$(git rev-parse origin/main)
          if [ "$START_HEAD" != "$REMOTE_HEAD" ]; then
            if ! git diff --quiet "$START_HEAD" "$REMOTE_HEAD" -- data.js package.json package-lock.json scripts .github/workflows/refresh-sa-performance.yml; then
              echo 'Collector/data inputs changed during parallel run; refusing stale publish.'
              exit 1
            fi
          fi
          git reset --hard origin/main
          cp /tmp/refreshed-data.js data.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data.js; then echo 'No data changes.'; exit 0; fi
          git add data.js
          git commit -m 'refresh full JSE Main Market via parallel collectors'
          git push origin HEAD:main
