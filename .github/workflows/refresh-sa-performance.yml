name: Refresh StockAnalysis Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 1-5'
  push:
    paths:
      - '.github/workflows/refresh-sa-performance.yml'
      - 'scripts/refresh-sa-performance.mjs'
      - 'package.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture SA interval returns
        run: npm run refresh:sa

      - name: Commit refreshed performance
        run: |
          if git diff --quiet -- data.js; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m 'refresh StockAnalysis performance intervals'
          git push
