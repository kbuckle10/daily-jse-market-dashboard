name: Refresh StockAnalysis Performance

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 18:00 Jamaica (UTC-5 year-round)
    - cron: '0 23 * * *'
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/refresh-sa-performance.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture SA fallback and interval returns
        run: npm run refresh:sa

      - name: Capture JSE official market close
        run: npm run refresh:jse

      - name: Capture direct JSE listed-company links
        run: npm run refresh:jse-links

      - name: Validate refreshed dataset
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const raw = fs.readFileSync('data.js','utf8');
          const m = raw.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/);
          if (!m) throw new Error('Unable to parse data.js');
          const data = vm.runInNewContext(`(${m[1]})`);
          const fields = ['w1','m1','ytd','m3','m6','y1'];
          const missing = [];
          for (const s of data.stocks) {
            for (const f of fields) if (s[f] == null || !Number.isFinite(Number(s[f]))) missing.push(`${s.ticker} ${f}`);
            if (s.price == null || !Number.isFinite(Number(s.price))) missing.push(`${s.ticker} price`);
            if (!/\/trading\/instruments\/\?instrument=\d+/.test(s.jse || '')) missing.push(`${s.ticker} direct JSE link`);
          }
          if (missing.length) {
            console.error('Missing required dashboard fields:');
            missing.forEach(x => console.error(` - ${x}`));
            process.exit(1);
          }
          const jse = data.stocks.filter(s => s.source === 'JSE').length;
          const directLinks = data.stocks.filter(s => /\/trading\/instruments\/\?instrument=\d+/.test(s.jse || '')).length;
          console.log(`Validated ${data.stocks.length} stocks. Current quote sources: JSE=${jse}. Direct JSE links=${directLinks}.`);
          NODE

      - name: Commit refreshed market data
        run: |
          if git diff --quiet -- data.js; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m 'refresh JSE market data, links and SA intervals'
          git push
