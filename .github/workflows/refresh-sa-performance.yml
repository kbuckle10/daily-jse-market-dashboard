name: Refresh Daily JSE Main Market

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 18:00 Jamaica (UTC-5 year-round)
    - cron: '0 23 * * *'
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/refresh-sa-performance.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync full Main Market universe from master dashboard
        run: npm run sync:main-market

      - name: Capture SA delayed quotes and interval returns
        run: npm run refresh:sa
        continue-on-error: true

      - name: Capture JSE official market close
        run: npm run refresh:jse
        continue-on-error: true

      - name: Capture direct JSE listed-company links
        run: npm run refresh:jse-links
        continue-on-error: true

      - name: Validate full-universe dataset
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const raw = fs.readFileSync('data.js','utf8');
          const m = raw.match(/window\.JSE_DASHBOARD_DATA\s*=\s*([\s\S]*);\s*$/);
          if (!m) throw new Error('Unable to parse data.js');
          const data = vm.runInNewContext(`(${m[1]})`);
          if (!Array.isArray(data.stocks) || data.stocks.length < 20) {
            throw new Error(`Main Market universe unexpectedly small: ${data.stocks?.length || 0}`);
          }
          const bad = data.stocks.filter(s => !s.ticker || !s.company);
          if (bad.length) throw new Error(`Invalid stock records: ${bad.length}`);
          const priced = data.stocks.filter(s => s.price != null && Number.isFinite(Number(s.price))).length;
          console.log(`Validated ${data.stocks.length} Main Market stocks; ${priced} currently have usable prices.`);
          NODE

      - name: Commit refreshed market data
        run: |
          if git diff --quiet -- data.js; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m 'refresh full JSE Main Market daily data'
          git pull --rebase origin main
          git push
